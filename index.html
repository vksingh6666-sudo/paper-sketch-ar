<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Paper Sketch AR</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#v{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#o{
  position:fixed;
  left:50%;
  top:43%;
  max-width:88vw;
  max-height:62vh;
  transform:translate(-50%,-50%);
  touch-action:none;
  user-select:none;
}

#spiro,
#spray{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-height:42vh;
  overflow:auto;
  padding:7px;
  background:#000c;
  color:#fff;
  text-align:center;
  box-sizing:border-box;
}

.row{
  margin:4px 0;
}

button,label{
  display:inline-block;
  padding:8px 9px;
  margin:2px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#111;
  font-weight:bold;
  font-size:13px;
}

button:active{
  transform:scale(.96);
}

input[type="range"]{
  width:85px;
  vertical-align:middle;
}

input[type="text"]{
  width:155px;
  padding:9px;
  border:0;
  border-radius:8px;
}

select{
  padding:7px;
  border-radius:7px;
}

#pick{
  display:none;
}

#msg{
  position:fixed;
  top:7px;
  left:7px;
  right:7px;
  padding:7px;
  background:#000a;
  color:#fff;
  text-align:center;
  border-radius:8px;
  z-index:20;
  font-size:13px;
}

.panel{
  border-top:1px solid #555;
  margin-top:4px;
  padding-top:4px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<!-- CAMERA -->
<video id="v" autoplay playsinline muted></video>

<!-- PHOTO / SKETCH -->
<img id="o" hidden>

<!-- DRAWING LAYERS -->
<canvas id="spiro"></canvas>
<canvas id="spray"></canvas>

<div id="msg">
📷 Camera → 🖼️ Photo → ✏️ Sketch → 📄 Trace
</div>

<div id="bar">

  <!-- MAIN BUTTONS -->
  <div class="row">

    <button id="start">
      📷 Camera
    </button>

    <label>
      🖼️ Photo
      <input id="pick" type="file" accept="image/*">
    </label>

    <button id="originalBtn">
      📷 Original
    </button>

    <button id="sketchBtn">
      ✏️ Sketch
    </button>

    <button id="webSearchBtn">
      🌐 Web Search
    </button>

  </div>

  <!-- WEB SEARCH -->
  <div class="row">

    <input
      id="webQuery"
      type="text"
      placeholder="🔎 Photo खोजें..."
    >

    <button id="searchBtn">
      🔎 Search
    </button>

  </div>

  <!-- PHOTO CONTROLS -->
  <div class="row">

    Opacity
    <input
      id="op"
      type="range"
      min="0"
      max="100"
      value="65"
    >

    Dark
    <input
      id="dk"
      type="range"
      min="50"
      max="220"
      value="150"
    >

    Zoom
    <input
      id="zm"
      type="range"
      min="30"
      max="250"
      value="100"
    >

  </div>

  <!-- TOOLS -->
  <div class="row">

    <button id="spiroBtn">
      ⭕ Spirograph
    </button>

    <button id="sprayBtn">
      🎨 Colour Spray
    </button>

    <button id="lock">
      🔓 Lock
    </button>

    <button id="reset">
      ↺ Reset
    </button>

  </div>


  <!-- SPIROGRAPH PANEL -->
  <div id="spiroControls"
       class="panel hidden">

    <b>⭕ Spirograph</b>

    <div class="row">

      Pattern

      <select id="pattern">

        <option value="1">
          Flower
        </option>

        <option value="2">
          Star
        </option>

        <option value="3">
          Circle
        </option>

        <option value="4">
          Mandala
        </option>

      </select>

      Size

      <input
        id="spSize"
        type="range"
        min="30"
        max="300"
        value="120"
      >

    </div>

    <div class="row">

      Brush

      <input
        id="brush"
        type="range"
        min="1"
        max="10"
        value="2"
      >

      Speed

      <input
        id="speed"
        type="range"
        min="1"
        max="20"
        value="5"
      >

      Colour

      <input
        id="colour"
        type="color"
        value="#ff0000"
      >

    </div>

  </div>


  <!-- COLOUR SPRAY PANEL -->
  <div id="sprayControls"
       class="panel hidden">

    <b>🎨 Colour Spray</b>

    <div class="row">

      Colour

      <input
        id="sprayColour"
        type="color"
        value="#ff0000"
      >

      Size

      <input
        id="spraySize"
        type="range"
        min="10"
        max="180"
        value="70"
      >

    </div>

    <div class="row">

      Density

      <input
        id="sprayDensity"
        type="range"
        min="5"
        max="100"
        value="35"
      >

      <button id="clearSpray">
        🧹 Clear Spray
      </button>

    </div>

    <div class="row">
      <small>
        Paper पर tap/click करके colour spray करें
      </small>
    </div>

  </div>

</div>


<script>

/* ==================================
   ELEMENTS
================================== */

const v =
document.getElementById("v");

const o =
document.getElementById("o");

const pick =
document.getElementById("pick");

const msg =
document.getElementById("msg");

const canvas =
document.getElementById("spiro");

const ctx =
canvas.getContext("2d");

const sprayCanvas =
document.getElementById("spray");

const sprayCtx =
sprayCanvas.getContext("2d");


/* ==================================
   VARIABLES
================================== */

let stream = null;

let locked = false;

let originalMode = false;

let originalImage = "";

let sketchImage = "";

let s = 1;

let x = 0;
let y = 0;

let drag = false;

let sx = 0;
let sy = 0;

let ox = 0;
let oy = 0;

let spiroOn = false;

let sprayOn = false;

let angle = 0;


/* ==================================
   APPLY PHOTO
================================== */

function apply(){

  if(!o.src) return;

  o.style.opacity =
    Number(op.value)/100;

  if(originalMode){

    o.style.filter =
      "none";

  }else{

    o.style.filter =
      "contrast(" +
      dk.value +
      "%) brightness(" +
      (260-Number(dk.value)) +
      "%)";

  }

  o.style.transform =
    "translate(calc(-50% + " +
    x +
    "px),calc(-50% + " +
    y +
    "px)) scale(" +
    s +
    ")";

}


/* ==================================
   CAMERA
================================== */

start.onclick =
async function(){

  try{

    if(!navigator.mediaDevices){

      alert(
        "Camera के लिए HTTPS page खोलें."
      );

      return;
    }

    stream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:{
          ideal:"environment"
        }
      },

      audio:false

    });

    v.srcObject =
      stream;

    msg.textContent =
      "📷 LIVE CAMERA — paper align करें";

  }catch(e){

    alert(
      "Camera permission Allow करें.\n" +
      "GitHub Pages का HTTPS page इस्तेमाल करें."
    );

  }

};


/* ==================================
   PHOTO SELECT
================================== */

pick.onchange =
function(e){

  const file =
    e.target.files[0];

  if(!file) return;

  const im =
    new Image();

  im.onload =
  function(){

    const c =
      document.createElement("canvas");

    const q =
      c.getContext("2d");

    const maxSize =
      1400;

    const scale =
      Math.min(
        1,
        maxSize /
        Math.max(
          im.width,
          im.height
        )
      );

    c.width =
      Math.round(im.width*scale);

    c.height =
      Math.round(im.height*scale);

    q.drawImage(
      im,
      0,
      0,
      c.width,
      c.height
    );


    /* ORIGINAL */

    originalImage =
      c.toDataURL(
        "image/jpeg",
        .92
      );


    /* CREATE SKETCH */

    const data =
      q.getImageData(
        0,
        0,
        c.width,
        c.height
      );

    const a =
      data.data;

    const w =
      c.width;

    const h =
      c.height;

    const gray =
      new Float32Array(
        w*h
      );

    let p = 0;

    for(
      let i=0;
      i<a.length;
      i+=4
    ){

      gray[p++] =
        .299*a[i] +
        .587*a[i+1] +
        .114*a[i+2];

    }


    const out =
      q.createImageData(
        w,
        h
      );


    for(
      let yy=1;
      yy<h-1;
      yy++
    ){

      for(
        let xx=1;
        xx<w-1;
        xx++
      ){

        p =
          yy*w+xx;

        const gx =
          -gray[p-w-1]
          -2*gray[p-1]
          -gray[p+w-1]
          +gray[p-w+1]
          +2*gray[p+1]
          +gray[p+w+1];

        const gy =
          -gray[p-w-1]
          -2*gray[p-w]
          -gray[p-w+1]
          +gray[p+w-1]
          +2*gray[p+w]
          +gray[p+w+1];

        const edge =
          Math.min(
            255,
            Math.hypot(
              gx,
              gy
            )
          );

        const k =
          p*4;

        const value =
          255-edge;

        out.data[k] =
          value;

        out.data[k+1] =
          value;

        out.data[k+2] =
          value;

        out.data[k+3] =
          255;

      }

    }


    q.putImageData(
      out,
      0,
      0
    );


    sketchImage =
      c.toDataURL();


    /* DEFAULT SKETCH */

    originalMode =
      false;

    o.src =
      sketchImage;

    o.hidden =
      false;

    x=0;
    y=0;
    s=1;

    zm.value =
      100;

    apply();


    msg.textContent =
      "✏️ SKETCH MODE — paper पर tracing करें";

  };

  im.src =
    URL.createObjectURL(file);

};


/* ==================================
   ORIGINAL
================================== */

originalBtn.onclick =
function(){

  if(!originalImage){

    alert(
      "पहले Photo चुनें."
    );

    return;
  }

  originalMode =
    true;

  o.src =
    originalImage;

  apply();

  msg.textContent =
    "📷 ORIGINAL PHOTO — reference mode";

};


/* ==================================
   SKETCH
================================== */

sketchBtn.onclick =
function(){

  if(!sketchImage){

    alert(
      "पहले Photo चुनें."
    );

    return;
  }

  originalMode =
    false;

  o.src =
    sketchImage;

  apply();

  msg.textContent =
    "✏️ SKETCH MODE — tracing करें";

};


/* ==================================
   WEB SEARCH
================================== */

webSearchBtn.onclick =
function(){

  webQuery.focus();

  msg.textContent =
    "🔎 Photo का नाम लिखकर Search दबाएँ";

};


searchBtn.onclick =
function(){

  const q =
    webQuery.value.trim();

  if(!q){

    alert(
      "Photo का नाम लिखें."
    );

    webQuery.focus();

    return;
  }

  const url =
    "https://www.google.com/search?tbm=isch&q=" +
    encodeURIComponent(q);

  window.open(
    url,
    "_blank"
  );

};


webQuery.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      searchBtn.click();

    }

  }
);


/* ==================================
   PHOTO CONTROLS
================================== */

op.oninput =
apply;

dk.oninput =
apply;

zm.oninput =
function(){

  s =
    Number(zm.value)/100;

  apply();

};


/* ==================================
   DRAG PHOTO
================================== */

o.onpointerdown =
function(e){

  if(locked)
    return;

  drag =
    true;

  sx =
    e.clientX;

  sy =
    e.clientY;

  ox =
    x;

  oy =
    y;

  o.setPointerCapture(
    e.pointerId
  );

};


o.onpointermove =
function(e){

  if(
    drag &&
    !locked
  ){

    x =
      ox +
      e.clientX -
      sx;

    y =
      oy +
      e.clientY -
      sy;

    apply();

  }

};


o.onpointerup =
function(){

  drag =
    false;

};


/* ==================================
   SPIROGRAPH CANVAS
================================== */

function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

  sprayCanvas.width =
    window.innerWidth;

  sprayCanvas.height =
    window.innerHeight;

  drawSpiro();

}


window.addEventListener(
  "resize",
  resizeCanvas
);


/* ==================================
   DRAW SPIROGRAPH
================================== */

function drawSpiro(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if(!spiroOn)
    return;

  const size =
    Number(spSize.value);

  const cx =
    canvas.width/2;

  const cy =
    canvas.height*.43;

  ctx.strokeStyle =
    colour.value;

  ctx.lineWidth =
    Number(brush.value);

  ctx.beginPath();

  const type =
    Number(pattern.value);

  const points =
    type===1 ? 720 :
    type===2 ? 360 :
    type===3 ? 240 :
    1000;


  for(
    let i=0;
    i<=points;
    i++
  ){

    const t =
      i*Math.PI*2/points;

    let r;


    if(type===1){

      r =
        size*
        (
          .55 +
          .35*Math.sin(7*t)
        );

    }

    else if(type===2){

      r =
        size*
        (
          .35 +
          .65*
          Math.abs(
            Math.cos(5*t)
          )
        );

    }

    else if(type===3){

      r =
        size*.65;

    }

    else{

      r =
        size*
        (
          .45 +
          .20*Math.sin(8*t) +
          .12*Math.sin(13*t)
        );

    }


    const px =
      cx +
      r*Math.cos(
        t+angle
      );

    const py =
      cy +
      r*Math.sin(
        t+angle
      );


    if(i===0)

      ctx.moveTo(
        px,
        py
      );

    else

      ctx.lineTo(
        px,
        py
      );

  }


  ctx.stroke();

  angle +=
    Number(speed.value)*.0005;


  if(spiroOn){

    requestAnimationFrame(
      drawSpiro
    );

  }

}


/* ==================================
   SPIROGRAPH BUTTON
================================== */

spiroBtn.onclick =
function(){

  spiroOn =
    !spiroOn;

  spiroControls
    .classList
    .toggle(
      "hidden",
      !spiroOn
    );


  if(spiroOn){

    msg.textContent =
      "⭕ SPIROGRAPH ON";

    drawSpiro();

  }else{

    msg.textContent =
      "Spirograph OFF";

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }

};


pattern.oninput =
drawSpiro;

spSize.oninput =
drawSpiro;

brush.oninput =
drawSpiro;

speed.oninput =
drawSpiro;

colour.oninput =
drawSpiro;


/* ==================================
   COLOUR SPRAY
================================== */

sprayBtn.onclick =
function(){

  sprayOn =
    !sprayOn;

  sprayControls
    .classList
    .toggle(
      "hidden",
      !sprayOn
    );


  if(sprayOn){

    msg.textContent =
      "🎨 COLOUR SPRAY ON — paper पर tap करें";

  }else{

    msg.textContent =
      "Colour Spray OFF";

  }

};


/* ==================================
   SPRAY FUNCTION
================================== */

function makeSpray(
  cx,
  cy
){

  const size =
    Number(
      spraySize.value
    );

  const density =
    Number(
      sprayDensity.value
    );


  sprayCtx.fillStyle =
    sprayColour.value;


  const count =
    Math.max(
      5,
      Math.round(
        density*1.5
      )
    );


  for(
    let i=0;
    i<count;
    i++
  ){

    const angle =
      Math.random()*
      Math.PI*2;

    const radius =
      Math.sqrt(
        Math.random()
      )*
      size;

    const px =
      cx +
      Math.cos(angle)*
      radius;

    const py =
      cy +
      Math.sin(angle)*
      radius;


    const dot =
      Math.random()*2.5+1;


    sprayCtx.globalAlpha =
      Math.random()*.55+.25;


    sprayCtx.beginPath();

    sprayCtx.arc(
      px,
      py,
      dot,
      0,
      Math.PI*2
    );

    sprayCtx.fill();

  }


  sprayCtx.globalAlpha =
    1;

}


/* ==================================
   SPRAY TOUCH / CLICK
================================== */

function sprayAt(
  x,
  y
){

  if(
    !sprayOn ||
    locked
  )
    return;

  makeSpray(
    x,
    y
  );

}


sprayCanvas.addEventListener(
  "pointerdown",
  function(e){

    sprayAt(
      e.clientX,
      e.clientY
    );

  }
);


/* ==================================
   CLEAR SPRAY
================================== */

clearSpray.onclick =
function(){

  sprayCtx.clearRect(
    0,
    0,
    sprayCanvas.width,
    sprayCanvas.height
  );

};


/* ==================================
   LOCK
================================== */

lock.onclick =
function(){

  locked =
    !locked;

  lock.textContent =
    locked ?
    "🔒 Locked" :
    "🔓 Lock";


  msg.textContent =
    locked ?
    "🔒 LOCKED — अब paper पर trace करें" :
    "Overlay unlocked";

};


/* ==================================
   RESET
================================== */

reset.onclick =
function(){

  x=0;
  y=0;
  s=1;

  zm.value =
    100;

  op.value =
    65;

  dk.value =
    150;

  angle =
    0;

  originalMode =
    false;

  spiroOn =
    false;

  sprayOn =
    false;


  spiroControls
    .classList
    .add("hidden");

  sprayControls
    .classList
    .add("hidden");


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  sprayCtx.clearRect(
    0,
    0,
    sprayCanvas.width,
    sprayCanvas.height
  );


  if(sketchImage){

    o.src =
      sketchImage;

    o.hidden =
      false;

  }


  apply();

  msg.textContent =
    "↺ Reset complete";

};


/* ==================================
   START
================================== */

resizeCanvas();

</script>

</body>
</html>
