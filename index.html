<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paper Sketch AR</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;background:#000;
  font-family:Arial
}
#v{
  position:fixed;inset:0;width:100%;height:100%;object-fit:cover
}
#o{
  position:fixed;left:50%;top:45%;
  transform:translate(-50%,-50%);
  max-width:90vw;max-height:65vh;
  touch-action:none
}
#spiro{
  position:fixed;left:50%;top:45%;
  transform:translate(-50%,-50%);
  width:70vw;height:50vh;
  pointer-events:none;
}
#bar{
  position:fixed;bottom:0;left:0;right:0;
  max-height:38vh;overflow:auto;
  padding:8px;background:#000c;color:#fff;
  text-align:center
}
button,label{
  padding:8px;margin:2px;border:0;border-radius:8px;
  background:#fff;font-weight:bold
}
input{width:80px}
#msg{
  position:fixed;top:8px;left:8px;right:8px;
  text-align:center;color:#fff;background:#0009;
  padding:7px;border-radius:8px
}
#pick{display:none}
.row{margin:3px 0}
</style>
</head>

<body>

<video id="v" autoplay playsinline muted></video>

<img id="o" hidden>

<canvas id="spiro"></canvas>

<div id="msg">
📷 Start Camera → 🖼️ Choose Photo → ✏️ Sketch Overlay
</div>

<div id="bar">

<div class="row">
<button id="start">📷 Camera</button>
<label>🖼️ Photo
<input id="pick" type="file" accept="image/*">
</label>
<button id="spiroBtn">⭕ Spirograph</button>
<button id="lock">🔓 Lock</button>
<button id="reset">↺ Reset</button>
</div>

<div class="row">
Opacity
<input id="op" type="range" min="0" max="100" value="65">

Dark
<input id="dk" type="range" min="50" max="220" value="150">

Zoom
<input id="zm" type="range" min="30" max="220" value="100">
</div>

<div id="spiroControls" hidden>

<div class="row">
<b>⭕ Spirograph</b>
</div>

<div class="row">
Pattern
<select id="pattern">
<option value="1">Flower</option>
<option value="2">Star</option>
<option value="3">Circle</option>
<option value="4">Mandala</option>
</select>

Size
<input id="spSize" type="range" min="30" max="250" value="120">

Speed
<input id="speed" type="range" min="1" max="20" value="5">
</div>

<div class="row">
Brush
<input id="brush" type="range" min="1" max="8" value="2">

Colour
<input id="colour" type="color" value="#ff0000">
</div>

</div>
</div>

<script>

const v=document.getElementById('v');
const o=document.getElementById('o');
const pick=document.getElementById('pick');

const canvas=document.getElementById('spiro');
const ctx=canvas.getContext('2d');

let stream;
let locked=false;
let s=1,x=0,y=0,drag=false,sx,sy,ox,oy;

let spiroOn=false;
let angle=0;

function apply(){

  o.style.opacity=op.value/100;

  o.style.filter=
    'contrast('+dk.value+'%) brightness('+
    (260-dk.value)+'%)';

  o.style.transform=
    'translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px)) scale('+s+')';
}

start.onclick=async()=>{

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });

    v.srcObject=stream;

    msg.textContent=
      'LIVE CAMERA — paper पर reference sketch align करें';

  }catch(e){

    alert('Camera permission दें। HTTPS page जरूरी है।');

  }
};


pick.onchange=e=>{

  let f=e.target.files[0];

  if(!f)return;

  let im=new Image();

  im.onload=()=>{

    let c=document.createElement('canvas');
    let q=c.getContext('2d');

    let m=1200;
    let z=Math.min(1,m/Math.max(im.width,im.height));

    c.width=im.width*z;
    c.height=im.height*z;

    q.drawImage(im,0,0,c.width,c.height);

    let d=q.getImageData(0,0,c.width,c.height);
    let a=d.data;

    let w=c.width;
    let h=c.height;

    let g=new Float32Array(w*h);

    let i,p;

    for(i=0,p=0;i<a.length;i+=4,p++)
      g[p]=.299*a[i]+.587*a[i+1]+.114*a[i+2];

    let out=q.createImageData(w,h);

    for(let yy=1;yy<h-1;yy++)
    for(let xx=1;xx<w-1;xx++){

      p=yy*w+xx;

      let gx=
      -g[p-w-1]-2*g[p-1]-g[p+w-1]
      +g[p-w+1]+2*g[p+1]+g[p+w+1];

      let gy=
      -g[p-w-1]-2*g[p-w]-g[p-w+1]
      +g[p+w-1]+2*g[p+w]+g[p+w+1];

      let z2=Math.min(255,Math.hypot(gx,gy));

      let k=p*4;

      out.data[k]=
      out.data[k+1]=
      out.data[k+2]=255-z2;

      out.data[k+3]=255;
    }

    q.putImageData(out,0,0);

    o.src=c.toDataURL();
    o.hidden=false;

    apply();

    if(!stream)start.click();

    msg.textContent=
      '✏️ SKETCH OVERLAY LIVE — paper के साथ align करें';

  };

  im.src=URL.createObjectURL(f);
};


function resizeCanvas(){

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;

  drawSpiro();
}

window.addEventListener('resize',resizeCanvas);


function drawSpiro(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!spiroOn)return;

  let size=Number(spSize.value);

  let cx=canvas.width/2;
  let cy=canvas.height*0.45;

  let color=colour.value;

  ctx.strokeStyle=color;
  ctx.lineWidth=Number(brush.value);

  ctx.beginPath();

  let type=Number(pattern.value);

  let points=type===1?720:
             type===2?360:
             type===3?240:1000;

  for(let i=0;i<=points;i++){

    let t=i*Math.PI*2/points;

    let r;

    if(type===1){

      r=size*(0.55+
        0.35*Math.sin(7*t));

    }else if(type===2){

      r=size*(0.35+
        0.65*Math.abs(Math.cos(5*t)));

    }else if(type===3){

      r=size*0.65;

    }else{

      r=size*
        (0.45+
        0.20*Math.sin(8*t)+
        0.12*Math.sin(13*t));
    }

    let px=cx+r*Math.cos(t+angle);
    let py=cy+r*Math.sin(t+angle);

    if(i===0)
      ctx.moveTo(px,py);
    else
      ctx.lineTo(px,py);
  }

  ctx.stroke();

  angle+=Number(speed.value)*0.0005;

  if(spiroOn)
    requestAnimationFrame(drawSpiro);
}


spiroBtn.onclick=()=>{

  spiroOn=!spiroOn;

  spiroControls.hidden=!spiroOn;

  spiroBtn.textContent=
    spiroOn?'⭕ Hide Spirograph':'⭕ Spirograph';

  msg.textContent=
    spiroOn?
    '⭕ Spirograph ON — paper पर pattern align करें':
    'Spirograph OFF';

  if(spiroOn)
    drawSpiro();
  else
    ctx.clearRect(0,0,canvas.width,canvas.height);
};


pattern.oninput=drawSpiro;
spSize.oninput=drawSpiro;
brush.oninput=drawSpiro;
colour.oninput=drawSpiro;
speed.oninput=drawSpiro;


op.oninput=apply;
dk.oninput=apply;

zm.oninput=()=>{
  s=zm.value/100;
  apply();
};


o.onpointerdown=e=>{

  if(locked)return;

  drag=true;

  sx=e.clientX;
  sy=e.clientY;

  ox=x;
  oy=y;

  o.setPointerCapture(e.pointerId);
};


o.onpointermove=e=>{

  if(drag&&!locked){

    x=ox+e.clientX-sx;
    y=oy+e.clientY-sy;

    apply();
  }
};

o.onpointerup=()=>drag=false;


lock.onclick=()=>{

  locked=!locked;

  lock.textContent=
    locked?'🔒 Locked':'🔓 Lock';

  msg.textContent=
    locked?
    '🔒 LOCKED — अब paper पर trace करें':
    'Overlay unlocked';
};


reset.onclick=()=>{

  x=0;
  y=0;
  s=1;

  zm.value=100;
  op.value=65;
  dk.value=150;

  angle=0;

  apply();
  drawSpiro();
};


resizeCanvas();

</script>

</body>
</html>
